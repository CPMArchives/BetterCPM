name: Publish approved Altair 1.3 assets
on:
  push:
    branches: [codex/altair-publish-assets-1.3]
permissions:
  contents: write
concurrency:
  group: altair-1.3-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 6bfb621b6348e1f3782e2f12be4512fe37197306
          path: frozen-source
      - name: Reconstruct exact approved archives and publish additive assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: /usr/bin/python3 publication/altair-1.3/publish.py --source frozen-source --inputs publication/altair-1.3 --output publication-output --publish
      - uses: actions/upload-artifact@v4
        with:
          name: Altair-1.3-publication-result
          path: publication-output/publication-result.json
